const groups=[{id:'film',name:'个人 AIGC 影像',intro:'以导演思维组织叙事、表演与镜头。',series:[['animation','动画系列','二维、三维与风格化影像'],['shortfilm','微电影短片系列','完整故事与情绪表达'],['drama','短剧系列','高密度叙事与角色冲突'],['script','编剧剧本系列','故事设定、剧本与结构设计']]},{id:'design',name:'视觉设计',intro:'从概念到视觉系统，建立鲜明而统一的表达。',series:[['brand','品牌视觉设计','标识、视觉识别与品牌应用'],['ui','UI 设计','界面、信息层级与交互体验'],['other','其他设计','海报、插画与跨媒介设计']]},{id:'students',name:'学生作品',intro:'课堂创作成果与教学实践。',series:[['student-animation','动画系列','学生动画与风格探索'],['student-live','真人系列','学生真人影像创作']]}];const langs={film:['AIGC FILM','個人AI映像','Directing stories through image, performance and camera.','演出・演技・カメラで物語を紡ぐ。'],design:['VISUAL DESIGN','ビジュアルデザイン','Building distinct visual systems from concept to expression.','構想から表現へ、独自のビジュアルを築く。'],students:['STUDENT WORKS','学生作品','Creative outcomes from teaching and studio practice.','授業と制作から生まれた学生作品。'],animation:['ANIMATION','アニメーション','2D, 3D and expressive moving images.','2D・3Dと多様なアニメーション表現。'],shortfilm:['SHORT FILMS','短編映画','Complete stories and emotional narratives.','物語と感情を描く短編映像。'],drama:['SHORT DRAMA','ショートドラマ','Character conflict and condensed storytelling.','人物の葛藤を描く短編ドラマ。'],script:['SCREENWRITING','脚本','Story worlds, scripts and narrative structures.','世界観、脚本、物語構成。'],brand:['BRAND IDENTITY','ブランドデザイン','Identity systems and brand applications.','ブランドのアイデンティティと展開。'],ui:['UI DESIGN','UIデザイン','Interfaces, hierarchy and interaction.','画面設計、情報構造、インタラクション。'],other:['OTHER DESIGN','その他のデザイン','Posters, illustration and cross-media work.','ポスター、イラストと多媒体デザイン。'],'student-animation':['ANIMATION','アニメーション','Student animation and style studies.','学生によるアニメーションと表現研究。'],'student-live':['LIVE ACTION','実写映像','Student live-action films.','学生による実写映像作品。']};function tr(id){let a=langs[id]||['WORK','作品','',''];return a[0]+' / '+a[1]}function icon(id){let frame='<svg class="nouveau-icon" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="40"/><circle cx="48" cy="48" r="32"/>';let paths={animation:'<path d="M25 38c12-18 34-18 46 0M25 58c12 18 34 18 46 0"/><circle cx="48" cy="48" r="12"/>',shortfilm:'<path d="M21 52c12-18 42-22 54-5M21 60c17-4 36-4 54 2"/><circle cx="48" cy="45" r="10"/>',drama:'<path d="M25 26q23 14 46 0v34q-23 23-46 0Z"/><path d="M35 49q5-5 10 0m9 0q5-5 10 0M38 60q10 9 20 0"/>',script:'<path d="M30 25h28l9 10v38H30Z M58 25v11h9M37 46h23M37 55h23M37 64h15"/>',brand:'<path d="M48 19c15 15 23 33 0 58-23-25-15-43 0-58ZM32 52h32"/>',ui:'<rect x="23" y="27" width="50" height="42" rx="3"/><path d="M23 39h50M35 39v30M47 51h18M47 59h13"/>',other:'<path d="M48 20c9 12 14 14 28 28-14 14-19 16-28 28-9-12-14-14-28-28 14-14 19-16 28-28Z"/><circle cx="48" cy="48" r="9"/>','student-animation':'<path d="M26 58q22-44 44 0M26 58q22 22 44 0"/><circle cx="48" cy="46" r="8"/>','student-live':'<path d="M24 37h48v30H24ZM30 37l8-12h30l-8 12M37 48l23 9-23 9Z"/>',film:'<circle cx="48" cy="48" r="19"/><path d="M48 29v38M29 48h38M35 35l26 26M61 35 35 61"/>',design:'<path d="M48 18c14 17 14 43 0 60-14-17-14-43 0-60ZM32 64c13-10 19-10 32 0M48 18v60"/>',students:'<path d="M48 22c9 12 13 13 25 16-12 9-14 13-25 34-11-21-13-25-25-34 12-3 16-4 25-16Z"/><circle cx="48" cy="45" r="6"/>'};return frame+(paths[id]||'<path d="M48 18c20 20 20 40 0 60-20-20-20-40 0-60Z"/><path d="M20 48h56"/>')+'</svg>'}const categories=groups.flatMap(g=>g.series.map(s=>({id:s[0],name:s[1],intro:s[2],group:g})));const sample=[];const $=id=>document.getElementById(id);const key='carey-site-v2';let items;try{items=JSON.parse(localStorage.getItem(key))||sample}catch{items=sample}items=items.filter(i=>!['sample1','sample2'].includes(i.id));localStorage.setItem(key,JSON.stringify(items));const featured={id:'oep1-short-drama',title:'出海短剧｜OEP1',titleEn:'OEP1 · Short Drama',titleJa:'OEP1 · ショートドラマ',series:'drama',year:'竖屏短剧 · 2分10秒 / VERTICAL DRAMA · 2:10',description:'出海短剧影像片段。点击封面，在页面内观看完整视频。',descEn:'A vertical short drama. Play the full video here.',descJa:'縦型ショートドラマ。こちらで全編を再生できます。',cover:'assets/oep1-poster.webp',video:'assets/oep1-showcase.mp4',url:''};if(!localStorage.getItem(key+'-oep1-added')){if(!items.some(i=>i.id===featured.id))items.unshift(featured);localStorage.setItem(key,JSON.stringify(items));localStorage.setItem(key+'-oep1-added','1')}let state={page:'landing'};function node(tag,cls,txt){let x=document.createElement(tag);x.className=cls||'';if(txt!==undefined)x.textContent=txt;return x}let switching=false;function go(page,group,series){if(switching)return;let old=$('app').firstElementChild;let reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(!old||reduce){state={page,group,series};draw();scrollTo(0,0);return}switching=true;old.classList.add('view-exit');setTimeout(()=>{state={page,group,series};draw();scrollTo(0,0);switching=false},260)}function tile(name,sub,num,cls,click,id){let b=node('button','tile '+cls);let n=node('span','num',num);let body=node('div');let ornament=node('div','tile-ornament');ornament.innerHTML=icon(id);let title=node('h3','',name);let translation=node('span','translation',tr(id));let desc=node('p','',sub);let extra=node('span','translation detail-translation',(langs[id]?.[2]||'')+' / '+(langs[id]?.[3]||''));body.append(title,translation,desc,extra,node('span','arrow','❧'));b.append(n,ornament,body);b.onclick=click;return b}function draw(){let app=$('app');app.replaceChildren();let view=node('div','view '+(state.page==='works'?'works-page':state.page==='group'?'group-page':''));app.append(view);document.body.classList.toggle('is-landing',state.page==='landing');if(state.page==='landing'){let landing=node('section','landing');landing.innerHTML='<div class="sun-halo"></div><div class="sun-engraving"></div><div class="vine vine-left"></div><div class="vine vine-right"></div><div class="sun-shadow"></div><div class="light-passage"></div><div class="landing-copy"><span class="eyebrow">CINEMA · DESIGN · ART</span><h1>作品集<span class="landing-dot">.</span></h1><div class="landing-tri">PORTFOLIO <i></i> ポートフォリオ</div><p>一场关于影像与视觉的漫游。<small>A journey through film and visual art.<br>映像と視覚芸術をめぐる旅。</small></p><button class="enter" id="enterSite">进入作品集 <small>EXPLORE · 作品を見る</small> <span>❧</span></button></div><div class="landing-index">FILM · DESIGN · EDUCATION<br>映画 · デザイン · 教育</div><div class="landing-caption">ART / MOTION / STORY &nbsp; · &nbsp; 001</div>';view.append(landing);$('enterSite').onclick=()=>go('home')}else if(state.page==='home'){let hero=node('section','hero profile');let t=node('div','profile-copy');t.innerHTML='<span class="eyebrow">个人介绍 / PROFILE / プロフィール</span><div class="nameplate"><h1>Carey<em>.</em></h1><span>蒋皓泽</span></div><p class="profile-lead">AIGC 影视创作者、视觉设计师与讲师。以叙事为线索，将导演思维、视觉设计和生成技术放在同一创作流程里。<small>AI filmmaker, visual designer and educator.<br>AI映像制作者、ビジュアルデザイナー、講師。</small></p><div class="experience"><div><b>影视与 AIGC<small>FILM / 映像</small></b><span>短片、短剧、漫剧的策划与影像制作</span></div><div><b>视觉设计<small>DESIGN / デザイン</small></b><span>品牌视觉、IP 与界面设计经验</span></div><div><b>教学实践<small>TEACHING / 教育</small></b><span>AIGC 影视与视觉创作课程</span></div></div><span class="profile-seal">CINEMA · DESIGN · IMAGINATION　❧</span>';let p=node('div','portrait-art');p.setAttribute('role','img');p.setAttribute('aria-label','Carey 的艺术肖像，融入花藤与金色日轮');hero.append(t,p);view.append(hero);let sh=node('div','sectionhead');sh.innerHTML='<div><span class="eyebrow">SELECT A PATH</span><h2>探索作品 <small>EXPLORE / 作品を探す</small></h2></div><p>选择领域，进入作品系列<br>Choose a field / 分野を選ぶ</p>';view.append(sh);let grid=node('div','grid3');groups.forEach((g,i)=>grid.append(tile(g.name,g.intro,'0'+(i+1)+' / 03','entry',()=>go('group',g.id),g.id)));view.append(grid)}else{let g=groups.find(x=>x.id===state.group);let back=node('button','back',state.page==='group'?'❧ 返回总览 / BACK / 戻る':'❧ 返回 / BACK / 戻る · '+g.name);back.onclick=()=>state.page==='group'?go('home'):go('group',g.id);view.append(back);if(state.page==='group'){view.append(node('span','eyebrow','PORTFOLIO / '+g.id.toUpperCase()),node('h1','title',g.name),node('div','title-translation',tr(g.id)),node('p','desc',g.intro+' '+langs[g.id][2]+' / '+langs[g.id][3]));let grid=node('div','grid2');g.series.forEach((s,i)=>grid.append(tile(s[1],s[2],'0'+(i+1)+' / 0'+g.series.length,'category',()=>go('works',g.id,s[0]),s[0])));view.append(grid)}else{let c=categories.find(x=>x.id===state.series);view.append(node('span','eyebrow',g.name+' / SERIES / シリーズ'),node('h1','title',c.name),node('div','title-translation',tr(c.id)),node('p','desc',c.intro+' '+langs[c.id][2]+' / '+langs[c.id][3]));let list=items.filter(i=>i.series===c.id);if(!list.length){let empty=node('div','empty');empty.innerHTML='<b>作品即将加入 / COMING SOON / 近日公開</b><br>这个系列的位置已经留好。可在“编辑作品”里添加内容。<br>New work will appear here. / 新しい作品はこちらに掲載されます。';view.append(empty)}else{let grid=node('div','grid2 works-gallery');list.forEach((i,idx)=>{let b=node(i.video?'article':'button','tile work'+(i.video?' video-work':''));b.append(node('span','work-number',String(idx+1).padStart(2,'0')));let visual=node('div','visual');if(i.video){let player=node('video','inline-player');player.controls=true;player.preload='metadata';player.playsInline=true;player.poster='/'+i.cover.replace(/^\//,'');player.controlsList='nodownload';player.disablePictureInPicture=true;player.setAttribute('aria-label',i.title+' 视频播放');let source=node('source');source.src='/'+i.video.replace(/^\//,'');source.type='video/mp4';player.append(source);player.addEventListener('contextmenu',e=>e.preventDefault());let failure=node('div','playback-error');failure.hidden=true;failure.append(node('span','','视频加载失败。请刷新页面，或在新窗口播放。'));let fallback=node('a','','新窗口播放 / OPEN VIDEO');fallback.href=source.src;fallback.target='_blank';fallback.rel='noopener noreferrer';failure.append(fallback);player.addEventListener('error',()=>failure.hidden=false);source.addEventListener('error',()=>failure.hidden=false);player.addEventListener('loadedmetadata',()=>failure.hidden=true);visual.append(player,failure)}else{if(i.cover){let img=node('img');img.src=i.cover;img.alt='';img.loading='lazy';visual.append(img)}visual.append(node('span','',i.title));let overlay=node('div','work-overlay');overlay.append(node('span','eyebrow',c.name+' / '+tr(c.id)),node('p','',[i.description,i.descEn,i.descJa].filter(Boolean).join(' / ')||'点击查看项目介绍 / View project / 作品を見る'),node('span','overlay-action','查看项目 / VIEW / 詳細 ❧'));visual.append(overlay)}let info=node('div','work-info');let t=node('div');t.append(node('h3','',i.title),node('small','',[(i.titleEn||''),(i.titleJa||'')].filter(Boolean).join(' / ')||tr(c.id)),node('small','',i.year||c.name));if(i.video){t.append(node('p','video-description',i.description||'点击播放视频'));let playButton=node('button','play-trigger','❧ 播放视频 / PLAY / 再生');playButton.onclick=()=>{let player=visual.querySelector('video');player.scrollIntoView({behavior:'smooth',block:'center'});player.play().catch(()=>{visual.querySelector('.playback-error').hidden=false})};t.append(playButton)}info.append(t,node('span','arrow','❧'));b.append(visual,info);if(!i.video)b.onclick=()=>detailOpen(i);grid.append(b)});view.append(grid)}}}}function detailOpen(i){let c=categories.find(x=>x.id===i.series);$('detailSeries').textContent=c?c.name+' / '+tr(c.id):'';$('detailTitle').textContent=i.title+' · '+(i.titleEn||'')+' '+(i.titleJa||'');$('detailDesc').textContent=[i.description||'暂无介绍',i.descEn||'',i.descJa||''].filter(Boolean).join(' / ');$('detailPic').replaceChildren();$('detailPic').classList.toggle('video-stage',!!i.video);if(i.video){let video=node('video');video.src=i.video;video.poster=i.cover||'';video.controls=true;video.controlsList='nodownload noplaybackrate';video.disablePictureInPicture=true;video.preload='metadata';video.playsInline=true;video.addEventListener('contextmenu',e=>e.preventDefault());$('detailPic').append(video)}else if(i.cover){let img=node('img');img.src=i.cover;img.alt=i.title;$('detailPic').append(img)}else $('detailPic').textContent=i.title;$('detailLink').hidden=!!i.video||!i.url;if(i.url)$('detailLink').href=i.url;$('detail').showModal()}function listEditor(){$('list').replaceChildren(...items.map(i=>{let b=node('button','',i.title);b.onclick=()=>load(i);return b}))}function load(i){$('itemId').value=i?.id||'';$('titleInput').value=i?.title||'';$('titleEnInput').value=i?.titleEn||'';$('titleJaInput').value=i?.titleJa||'';$('seriesInput').value=i?.series||categories[0].id;$('yearInput').value=i?.year||'';$('descInput').value=i?.description||'';$('descEnInput').value=i?.descEn||'';$('descJaInput').value=i?.descJa||'';$('coverInput').value=i?.cover||'';$('urlInput').value=i?.url||''}function save(){localStorage.setItem(key,JSON.stringify(items));draw();listEditor()}$('seriesInput').replaceChildren(...categories.map(c=>{let o=node('option','',c.group.name+' / '+c.name);o.value=c.id;return o}));$('home').onclick=()=>go('landing');$('intro').onclick=()=>go('home');$('nav-film').onclick=()=>go('group','film');$('nav-design').onclick=()=>go('group','design');$('nav-students').onclick=()=>go('group','students');$('edit').onclick=()=>{listEditor();load(null);$('editor').showModal()};$('new').onclick=()=>load(null);$('form').onsubmit=e=>{e.preventDefault();let i={id:$('itemId').value||crypto.randomUUID(),title:$('titleInput').value.trim(),titleEn:$('titleEnInput').value.trim(),titleJa:$('titleJaInput').value.trim(),series:$('seriesInput').value,year:$('yearInput').value.trim(),description:$('descInput').value.trim(),descEn:$('descEnInput').value.trim(),descJa:$('descJaInput').value.trim(),cover:$('coverInput').value.trim(),url:$('urlInput').value.trim()};let n=items.findIndex(x=>x.id===i.id);if(n<0)items.unshift(i);else{if(items[n].video)i.video=items[n].video;items[n]=i;}save();load(i)};$('remove').onclick=()=>{let id=$('itemId').value;if(id&&confirm('确认删除这件作品？')){items=items.filter(i=>i.id!==id);save();load(null)}};$('export').onclick=()=>{let a=document.createElement('a'),blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='carey-portfolio-works.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('detail').addEventListener('close',()=>{let video=$('detailPic').querySelector('video');if(video)video.pause()});$('importFile').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data)||!data.every(i=>typeof i.title==='string'&&categories.some(c=>c.id===i.series)))throw Error();items=data;save();load(null)}catch{alert('作品数据格式不正确')}e.target.value=''};draw();
</script></body></html>
