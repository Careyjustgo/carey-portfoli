/* Geng Geng: isolated transparent 3D renderings, without sticker discs or tiles. */
.brand-geng-stickers{background:#e8dfca;isolation:isolate}
.brand-geng-stickers .brand-expression-intro{max-width:960px;margin-bottom:24px}
.geng-sticker-group{position:relative;padding:22px 0 30px;border-top:1px solid #a88e61}
.geng-sticker-group+.geng-sticker-group{margin-top:18px}
.geng-sticker-group-head{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);align-items:end;gap:20px;margin-bottom:20px}
.geng-sticker-group-head h6{margin:0;color:#264433;font:500 clamp(22px,2.4vw,32px)/1.25 Georgia,'Songti SC',serif}
.geng-sticker-group-head p{margin:0;color:#514a3b;font:13px/1.65 var(--carey-ui)}

.brand-geng-stickers .geng-sticker,.brand-geng-stickers .geng-sticker:nth-child(4n){display:block;height:auto;min-height:0;padding:0;transform:none;border:0;background:transparent}

.brand-geng-stickers .geng-sticker[data-motion=surprise] img{animation-name:gengSurprise}
.brand-geng-stickers .geng-sticker[data-motion=defiant] img{animation-name:gengDefiant}
.brand-geng-stickers .geng-sticker[data-motion=delight] img{animation-name:gengDelight}

.brand-geng-stickers .geng-sticker[data-motion=curious] img{animation-name:gengCurious}
.brand-geng-stickers .geng-sticker[data-motion=playful] img{animation-name:gengPlayful}
.brand-geng-stickers .geng-sticker[data-motion=wave] img{animation-name:gengWave}
.brand-geng-stickers .geng-sticker[data-motion=jump] img{animation-name:gengJump}
.brand-geng-stickers .geng-sticker[data-motion=bow] img{animation-name:gengBow}
.brand-geng-stickers .geng-sticker[data-motion=camera] img{animation-name:gengCamera}
.brand-geng-stickers .geng-sticker[data-motion=clap] img{animation-name:gengClap}
.brand-geng-stickers .geng-sticker[data-motion=edit] img{animation-name:gengEdit}

@keyframes gengIdle{0%,100%{transform:translateY(2px) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}

.artwork-count{position:absolute;right:0;top:10px;color:#b9a071;font:40px/1 Georgia,serif}

.artwork-action{display:block;padding:10px 3px 2px;color:#183c2d;font:11px/1.5 var(--carey-ui);text-align:right}
