name: Sync Carey portfolio

on:
  push:
    paths:
      - media-sync-manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify portfolio files
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import shutil
          import tempfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          manifest = json.loads(Path('media-sync-manifest.json').read_text())
          source = manifest['source'].rstrip('/') + '/'
          files = manifest['files']
          staging = Path(tempfile.mkdtemp(prefix='carey-portfolio-'))

          def fetch(entry):
              path = entry['path']
              target = staging / path
              target.parent.mkdir(parents=True, exist_ok=True)
              url = urllib.parse.urljoin(source, urllib.parse.quote(path, safe='/'))
              error = None
              for attempt in range(4):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'CareyPortfolioSync/1.0'})
                      digest = hashlib.sha256()
                      size = 0
                      with urllib.request.urlopen(request, timeout=120) as response, target.open('wb') as output:
                          while chunk := response.read(1024 * 1024):
                              output.write(chunk)
                              digest.update(chunk)
                              size += len(chunk)
                      if size != entry['size'] or digest.hexdigest() != entry['sha256']:
                          raise ValueError(f'File verification failed: {path}')
                      return path
                  except Exception as exc:
                      error = exc
                      target.unlink(missing_ok=True)
                      time.sleep(2 ** attempt)
              raise RuntimeError(f'Could not fetch {path}: {error}')

          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              futures = [pool.submit(fetch, entry) for entry in files]
              for n, future in enumerate(concurrent.futures.as_completed(futures), 1):
                  future.result()
                  if n % 50 == 0 or n == len(files):
                      print(f'Verified {n}/{len(files)} files')

          for item in staging.iterdir():
              target = Path(item.name)
              if item.is_dir():
                  shutil.copytree(item, target, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, target)
          Path('.nojekyll').touch()
          print(f'Installed portfolio version {manifest["site_version"]}')
          PY
      - name: Commit verified website
        run: |
          git config user.name "Carey portfolio sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets .nojekyll
          if git diff --cached --quiet; then
            echo 'Website already matches the manifest.'
          else
            git commit -m "Complete missing public portfolio media assets"
            git push origin HEAD:main
          fi
